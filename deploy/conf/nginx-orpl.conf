# ============================================================
#  Order Platform · nginx 站点配置
#
#  放置位置：/etc/nginx/conf.d/orpl.conf
#  作用：
#    /                项目门户（/opt/orpl/web/portal）
#    /admin/          管理端静态页（/opt/orpl/web/admin），/api/** 反代到后端 /admin/**
#    /user/ 等        小程序 / H5 用户端接口
#    /download/       安卓 APK 下载
#    /doc.html        接口文档（Knife4j）
# ============================================================

upstream orpl_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    charset utf-8;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff font/woff2;
    gzip_vary on;

    # 菜品图片/Excel 报表上传，后端上限 100MB
    client_max_body_size 100m;

    # ------------------------------------------------------------
    # 1) 项目门户
    # ------------------------------------------------------------
    root /opt/orpl/web/portal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ------------------------------------------------------------
    # 2) 管理端静态页（/admin/ -> /opt/orpl/web/admin/）
    #    页面用 hash 路由，深路径回落到 /admin/index.html
    # ------------------------------------------------------------
    location /admin/ {
        root /opt/orpl/web;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    # 管理端 js/css 没有文件名哈希，禁止长缓存
    location ~ ^/admin/.+\.(js|css)$ {
        root /opt/orpl/web;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ ^/admin/.+\.(png|jpe?g|gif|ico|svg|woff2?|ttf|eot|map)$ {
        root /opt/orpl/web;
        expires 7d;
    }

    # ------------------------------------------------------------
    # 3) 管理端接口：/api/employee/login -> 后端 /admin/employee/login
    #    令牌请求头是 zmlhsc
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass         http://orpl_backend/admin/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    # ------------------------------------------------------------
    # 4) 用户端接口（小程序 / H5）
    # ------------------------------------------------------------
    location /user/ {
        proxy_pass         http://orpl_backend/user/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    location /shopping-cart/ {
        proxy_pass         http://orpl_backend/shopping-cart/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /addressBook/ {
        proxy_pass         http://orpl_backend/addressBook/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------
    # 5) 上传图片（后端本地存储目录，未配置 OSS 时使用）
    # ------------------------------------------------------------
    location /uploads/ {
        alias /opt/orpl/web/uploads/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # 6) 安卓安装包下载
    # ------------------------------------------------------------
    location /download/ {
        root /opt/orpl/web;
        autoindex off;
    }

    location = /download/orpl-admin.apk {
        alias /opt/orpl/web/download/orpl-admin.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="orpl-admin.apk"';
        add_header Content-Type application/vnd.android.package-archive;
    }

    # ------------------------------------------------------------
    # 7) 健康检查 / 接口文档
    # ------------------------------------------------------------
    location = /health {
        proxy_pass       http://orpl_backend/health;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location = /doc.html {
        proxy_pass       http://orpl_backend/doc.html;
        proxy_set_header Host $host;
    }

    location ^~ /v3/api-docs {
        proxy_pass       http://orpl_backend;
        proxy_set_header Host $host;
    }

    location ^~ /swagger-ui {
        proxy_pass       http://orpl_backend;
        proxy_set_header Host $host;
    }

    location ^~ /webjars/ {
        proxy_pass       http://orpl_backend;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------------------
    # 8) 错误页
    # ------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

