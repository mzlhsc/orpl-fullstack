# ============================================================================
#  Ordering-platform-mzlhsc（苍穹外卖改造版）nginx 配置
#
#  作用：
#    1) 托管管理端前端（原生静态页面，位于 html/admin）
#    2) 把管理端的 /api/** 反向代理到后端 /admin/**
#    3) 把用户端（小程序/H5）的 /user/** 反向代理到后端 /user/**
#    4) 顺带把接口文档 /doc.html 也代理出去
#
#  与项目的对应关系（改动后端端口时，只需要改下面 upstream 的 8080）：
#    前端请求前缀 = "/api"          请求头 = zmlhsc: <员工令牌>
#    后端 server.port  = 8080      （见 orpl-service/src/main/resources/application.yml）
#
#  启动：在本目录（nginx.exe 所在目录）执行  start nginx
#  重载：nginx -s reload      停止：nginx -s stop
#  自检：nginx -t
# ============================================================================

#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # 静态资源压缩，管理端的 js/css 体积较大，开启后首屏明显变快
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff font/woff2;
    gzip_vary         on;

    # 菜品图片/Excel 报表上传：后端限制 max-request-size=100MB，
    # nginx 默认只有 1MB，不放宽会在上传大图时直接 413
    client_max_body_size 100m;

    # WebSocket 协议升级用
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------------------------------------------------------
    # 后端服务：本项目 order-platform 的 orpl-service
    # 注意：这里的端口要和 orpl-service/src/main/resources/application.yml 里的 server.port 保持一致
    # ---------------------------------------------------------------
    upstream sky_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost 127.0.0.1;

        charset utf-8;

        # ---------------------------------------------------------------
        # 1) 管理端静态页面（html/admin）
        #    页面使用 hash 路由；try_files 兼容直接访问深层路径时回落 index.html
        # ---------------------------------------------------------------
        location / {
            root       html/admin;
            index      index.html index.htm;
            try_files  $uri $uri/ /index.html;
        }

        # index.html 不能缓存，否则前端发版后用户看到的还是旧版本
        location = /index.html {
            root        html/admin;
            add_header  Cache-Control "no-cache, no-store, must-revalidate";
            add_header  Pragma "no-cache";
            add_header  Expires "0";
        }

        # 管理端脚本/样式没有文件名哈希，禁止长缓存，避免改版后浏览器继续用旧文件
        location ~* \.(js|css)$ {
            root        html/admin;
            add_header  Cache-Control "no-cache, must-revalidate";
        }

        # 图片与字体可以缓存一周
        location ~* \.(png|jpe?g|gif|ico|svg|woff2?|ttf|eot|map)$ {
            root     html/admin;
            expires  7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # ---------------------------------------------------------------
        # 2) 管理端接口：/api/employee/login  ->  后端 /admin/employee/login
        #    （前端 API 封装里的 baseURL 是 /api，后端管理端接口统一挂在 /admin 下）
        # ---------------------------------------------------------------
        location /api/ {
            proxy_pass         http://sky_backend/admin/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
        }

        # ---------------------------------------------------------------
        # 3) 用户端接口（小程序/H5 直连 nginx 时使用）
        # ---------------------------------------------------------------
        location /user/ {
            proxy_pass         http://sky_backend/user/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_read_timeout    120s;
        }

        # ---------------------------------------------------------------
        # 健康检查：直接访问外层的 /health，便于区分 nginx 与后端故障
        # ---------------------------------------------------------------
        location = /health {
            proxy_pass       http://sky_backend/health;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------------------------
        # 4) 接口文档（Knife4j / springdoc）
        #    外层用 /doc.html 访问，省得记 8080 端口
        # ---------------------------------------------------------------
        location = /doc.html {
            proxy_pass       http://sky_backend/doc.html;
            proxy_set_header Host $host;
        }
        location ^~ /v3/api-docs {
            proxy_pass       http://sky_backend;
            proxy_set_header Host $host;
        }
        location ^~ /webjars/ {
            proxy_pass       http://sky_backend;
            proxy_set_header Host $host;
        }
        location ^~ /swagger-ui {
            proxy_pass       http://sky_backend;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------------------------
        # 5) WebSocket（当前项目暂未使用，预留）
        # ---------------------------------------------------------------
        location /ws/ {
            proxy_pass         http://sky_backend/ws/;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "$connection_upgrade";
            proxy_set_header   Host       $host;
        }

        # ---------------------------------------------------------------
        # 6) 错误页
        # ---------------------------------------------------------------
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}



